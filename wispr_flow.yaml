name: Wispr Flow
entryKey: fragai-wispr-flow
shortDescription: Search meetings, transcripts, notes, calendars, and tasks
description: |
  Search Wispr Flow meetings, recordings, transcripts, notes, calendar events, action items, and tasks.

  ## What you can do
  - Search meetings and retrieve recordings or transcripts
  - Find decisions, summaries, and action items across meeting history
  - Search scratchpad notes and calendar events
  - Create, retrieve, search, and update tasks

  ## Before connecting
  - Sign in through Wispr Flow OAuth
  - Available content follows the connected user's Wispr Flow access
  - Meetings, recordings, transcripts, notes, and calendars may contain confidential or personal information
  - Task tools change account data; confirm task content, assignee, dates, and source meeting before approval

  See the official [Wispr Flow MCP documentation](https://docs.wisprflow.ai/articles/4759919286-how-to-connect-wispr-flow-to-claude-chatgpt-and-other-ai-tools-mcp) for setup and current tools.
