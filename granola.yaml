name: Granola
entryKey: fragai-granola
shortDescription: Search Granola meeting notes, transcripts, decisions, and action items
description: |
  Connect FragAI to Granola's official MCP server to retrieve meeting knowledge owned by the signed-in user.

  ## What you can do
  - Search meeting notes by topic, participant, or date
  - Retrieve meeting details, private notes, and enhanced notes
  - Extract decisions, action items, and recurring themes
  - Read raw transcripts when the connected Granola plan supports them

  ## Before connecting
  - Sign in to Granola through browser OAuth
  - Enterprise administrators must enable MCP access for the workspace
  - The connection exposes only meeting notes owned by the connected user
  - Follow organizational consent and confidentiality rules for meeting content

  Setup details: [Granola MCP documentation](https://docs.granola.ai/help-center/sharing/integrations/mcp).
