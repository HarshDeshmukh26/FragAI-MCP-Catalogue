name: Databricks Unity Catalog Functions
entryKey: fragai-databricks-unity-catalog-functions
shortDescription: Discover and run approved Databricks Unity Catalog functions
description: |
  Connect FragAI to a Databricks-managed MCP endpoint that exposes registered Unity Catalog functions from one configured catalog and schema.

  ## What you can do
  - Discover functions available in the selected catalog and schema
  - Inspect function inputs and supported parameters
  - Execute permitted functions with Databricks serverless compute

  ## Before connecting
  - Confirm managed MCP servers are enabled for the Databricks workspace
  - Obtain the workspace URL and choose the catalog and schema that contain the approved functions
  - Create a personal access token and store it securely
  - Grant the connected user only the Unity Catalog and function permissions required for the workflow

  Functions may perform actions beyond simple data retrieval, so review each function's behavior before exposing it. Setup details: [Databricks managed MCP documentation](https://docs.databricks.com/aws/en/agents/mcp-tools).
metadata:
  categories: Data Analytics, Business Intelligence
icon: https://avatars.githubusercontent.com/u/4998052?s=200&v=4
repoURL: https://docs.databricks.com/aws/en/generative-ai/mcp/

config:
  - name: Databricks workspace hostname
    key: DATABRICKS_WORKSPACE_URL
    description: Full Databricks workspace URL, such as https://your-workspace.cloud.databricks.com
    required: true
    sensitive: false
    usage: env
  - name: Functions catalog
    key: DATABRICKS_FUNCTIONS_CATALOG
    description: Unity Catalog catalog containing the approved functions
    required: true
    sensitive: false
    usage: env
  - name: Functions schema
    key: DATABRICKS_FUNCTIONS_SCHEMA
    description: Schema within the selected catalog that contains the approved functions
    required: true
    sensitive: false
    usage: env
  - name: Personal Access Token
    description: Personal access token authorized to discover and run the selected functions
    key: Authorization
    required: true
    sensitive: true
    prefix: "Bearer "
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: ${DATABRICKS_WORKSPACE_URL}/api/2.0/mcp/functions/${DATABRICKS_FUNCTIONS_CATALOG}/${DATABRICKS_FUNCTIONS_SCHEMA}
