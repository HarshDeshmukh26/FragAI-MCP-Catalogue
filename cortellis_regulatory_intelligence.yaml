name: Cortellis Regulatory Intelligence
entryKey: fragai-cortellis-regulatory-intelligence
shortDescription: Research life-sciences regulations across countries and agencies
description: |
  Connect FragAI to Clarivate Cortellis Regulatory Intelligence to search licensed regulatory content and receive referenced summaries of life-sciences requirements.

  ## What you can do
  - Ask natural-language questions about global regulatory requirements
  - Compare guidance across countries and regulatory organizations
  - Follow references back to the underlying authoritative material
  - Research changes that may affect regulatory planning

  ## Before connecting
  - Use a valid Cortellis Regulatory Intelligence subscription
  - Sign in through Clarivate OAuth
  - Treat generated summaries as research assistance and verify material decisions against the referenced source documents

  This is a read-only connection. Setup details: [Cortellis MCP documentation](https://api.clarivate.com/lifesciences/mcp-regulatory/documentation).
metadata:
