name: Grafana Cloud
entryKey: fragai-grafana-cloud
shortDescription: Investigate and manage Grafana Cloud telemetry, dashboards, alerts, and incidents
description: |
  Connect FragAI to Grafana Cloud's hosted MCP server using the permissions of the signed-in Grafana user.

  ## What you can do
  - Query metrics, logs, profiles, traces, and supported cloud data sources
  - Search or manage dashboards, folders, annotations, alert rules, and notification routing
  - Review incidents, on-call schedules, teams, users, and alert groups
  - Start investigations and use Grafana Assistant capabilities enabled for the stack

  ## Before connecting
  - Use a hosted Grafana Cloud stack; this endpoint does not support self-hosted Grafana
  - Enable Grafana Assistant and grant the **Assistant Cloud MCP User** role or equivalent access
  - Sign in through OAuth and grant write access only when resource changes are required
  - Optionally provide the stack URL to skip stack selection

  Some tools can create incidents, folders, data sources, plugins, annotations, dashboards, or alerting changes. Require confirmation before write operations. Usage contributes to Grafana Assistant limits. See [Grafana Cloud MCP documentation](https://grafana.com/docs/grafana-cloud/ai-tools/mcp-servers/cloud-mcp/).
metadata:
  categories: Observability, Monitoring, DevOps, Incident Management
icon: https://avatars.githubusercontent.com/u/7195757?s=48&v=4
repoURL: https://grafana.com/docs/grafana-cloud/ai-tools/mcp-servers/cloud-mcp/
runtime: remote
remoteConfig:
  fixedURL: https://mcp.grafana.com/mcp
