name: Elasticsearch
entryKey: fragai-elasticsearch
shortDescription: Search Elasticsearch data and run governed Elastic Agent Builder tools
upgradeNote: |
  This entry now uses Elastic Agent Builder's official MCP endpoint. Existing users must reconnect with a Kibana URL and scoped Elastic API key. It requires a supported Agent Builder deployment, and replaces the legacy server's direct Query DSL and shard-inspection tools with Agent Builder tools.
description: |
  Connect FragAI to Elastic Agent Builder to search permitted Elasticsearch data and run built-in or custom tools configured for the selected Kibana space.

  ## What you can do
  - Discover accessible indices, aliases, data streams, and mappings
  - Search, count, aggregate, and summarize Elasticsearch data from natural language
  - Generate or execute ES|QL queries
  - Work with cases, visualizations, streams, and workflows when those tools are enabled
  - Search Elastic product documentation

  ## Before connecting
  - Use Elastic Cloud Serverless or another deployment version supported by Agent Builder
  - Enter the Kibana URL without a trailing slash and include `/s/<space-name>` for a non-default space
  - Create an API key with Agent Builder access and only the required index and feature privileges
  - Set an expiration date and rotate the API key regularly

  This connection can expose write and delete tools configured in Agent Builder. Require approval for changes to cases, streams, workflows, visualizations, or other resources. Setup details: [Elastic Agent Builder MCP documentation](https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/mcp-server).
metadata:
  categories: Databases, Data Analytics, Retrieval & Search
icon: https://avatars.githubusercontent.com/u/6764390?v=4
repoURL: https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/mcp-server

config:
  - key: KIBANA_URL
    name: Kibana URL
    required: true
    sensitive: false
    description: Kibana base URL without a trailing slash; include /s/<space-name> for a custom space
    usage: env
  - name: Elastic API Key
    description: API key limited to Agent Builder and the required Elasticsearch indices
    key: Authorization
    required: true
    sensitive: true
    prefix: "ApiKey "
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: ${KIBANA_URL}/api/agent_builder/mcp
toolPreview:
  - name: custom_content_update_panel
    description: Update the project panel template and its ES|QL data source.
    params:
      esqlQuery: New ES|QL query, or null to remove the query
      template: New LiquidJS HTML and CSS template
  - name: platform_core_cases
    description: Find Elastic cases and retrieve their details.
    params:
      alert_ids: Alert IDs to find related cases
      assignees: Case assignees to filter by
      case_id: Case ID for a single-case operation
      case_ids: Case IDs for a bulk operation
      category: Case category to filter by
      customFields: Custom field filters
      defaultSearchOperator: Default operator for search terms
      from: Start time for the case search range
      mode: Case operation to perform
      owner: Elastic application that owns the cases
      page: One-indexed result page
      perPage: Results per page
      reporters: Case reporters to filter by
      search: Text to search for
      searchFields: Case fields to search
      severity: Case severity to filter by
      similar_to_case_id: Case ID used to find similar cases
      sortField: Field used to sort cases
      sortOrder: Sort order for the results
      status: Case status to filter by
      tags: Case tags to filter by
      to: End time for the case search range
  - name: platform_core_cases_attachments
    description: Retrieve or manage comments, alerts, and event attachments on a case.
    params:
      alerts: Alerts to attach to a case
      case_id: Case ID to operate on
      comment: Comment content to add or update
      events: Events to attach to a case
      mode: Attachment operation to perform
  - name: platform_core_cases_manage
    description: Create, update, delete, or otherwise manage Elastic cases.
    params:
      assignees: Case assignees
      case_id: Case ID to operate on
      case_ids: Case IDs for a bulk operation
      case_template_id: Case template ID
      cases: Cases used by a bulk operation
      category: Case category
      connector_id: Connector ID for the case
      customFields: Case custom fields
      description: Case description
      field_name: Field to update
      mode: Case management operation to perform
      overwrites: Existing values to overwrite
      owner: Elastic application that owns the case
      settings: Case settings to update
      severity: Case severity
      tags: Case tags
      tags_to_add: Tags to add to cases
      template: Case template configuration
      title: Case title
      updates: Bulk case updates
      value: Value for the selected field
      version: Case version for optimistic concurrency
  - name: platform_core_cases_observables
    description: Add, inspect, update, or remove observables attached to a case.
    params:
      case_id: Case ID to operate on
      description: Observable description
      mode: Observable operation to perform
      observable_id: Observable ID to operate on
      observables: Observables for a bulk operation
      value: Observable value
  - name: platform_core_create_visualization
    description: Create or update an Elastic visualization from supplied search input.
    params:
      attachment_id: Attachment containing visualization context
      chartType: Visualization chart type
      esql: ES|QL query for the visualization
      index: Elasticsearch index for the visualization
      query: Natural language visualization request
      renderer: Visualization renderer to use
  - name: platform_core_list_indices
    description: List indices, aliases, and data streams visible to the connected user.
    params:
      pattern: Optional index, alias, or data stream pattern
  - name: platform_core_get_index_mapping
    description: Retrieve field mappings for an index or index pattern.
    params:
      indices: Index names or patterns whose mappings should be retrieved
      raw: Whether to return raw mappings
  - name: platform_core_search
    description: Search and analyze Elasticsearch data from a natural-language request.
    params:
      query: A natural language query expressing the search request
      index: Optional index to search; when omitted, Agent Builder selects an index based on the query
      time_range: Time range to apply to the search
  - name: platform_core_get_document_by_id
    description: Retrieve the complete source of one document by index and identifier.
    params:
      id: ID of the document to retrieve
      index: Name of the index containing the document
  - name: platform_core_execute_esql
    description: Run an ES|QL query and return its results as a table.
    params:
      limit: Maximum number of results to return
      params: Named parameters for the ES|QL query
      query: The ES|QL query to execute
      time_range: Time range to apply to the query
  - name: platform_core_execute_workflow
    description: Start an enabled Elastic workflow.
    params:
      attachmentId: Attachment containing workflow input
      inputs: Workflow inputs
      waitForCompletion: Whether to wait for workflow completion
      workflowId: Saved workflow ID
      yaml: Workflow YAML for an inline execution
  - name: platform_core_generate_esql
    description: Create an ES|QL query from a natural-language request.
    params:
      context: Additional context for query generation
      disable_named_params: Whether to disable named query parameters
      execute_query: Whether to execute the generated query
      index: Index to query
      query: Natural language query request
      time_range: Time range to apply to the query
  - name: platform_core_generate_workflow
    description: Create or revise an Elastic workflow definition from natural language.
    params:
      attachmentId: Attachment containing workflow context
      context: Additional workflow context
      instructions: Instructions for workflow generation
      query: Natural language workflow request
      workflowId: Saved workflow ID to update
  - name: platform_core_get_workflow_execution_status
    description: Retrieve the status and output of a workflow run.
    params:
      executionId: Workflow execution ID
  - name: platform_core_index_explorer
    description: Identify indices and mappings relevant to a natural-language question.
    params:
      indexPattern: Index pattern to explore
      limit: Maximum number of results to return
      query: Natural language query used to find relevant indices
  - name: platform_core_list_workflow_executions
    description: List recent Elastic workflow runs and their status.
    params:
      limit: Maximum number of executions to return
      page: One-indexed result page
      statuses: Execution statuses to include
      workflowId: Workflow ID to filter by
  - name: platform_core_product_documentation
    description: Search official Elastic product documentation.
    params:
      max: Maximum number of results to return
      product: Elastic product to search
      query: Documentation search query
  - name: platform_core_resume_workflow_execution
    description: Continue a paused Elastic workflow run.
    params:
      executionId: Workflow execution ID
      input: Input used to resume the workflow
  - name: platform_streams_create_partition
    description: Create a child partition within an Elastic stream.
    params:
      child_name: Name of the child stream
      condition_json: JSON routing condition for the partition
      confirmation_body: User confirmation for the change
      parent: Parent stream name
      status: Initial partition status
  - name: platform_streams_delete_stream
    description: Permanently delete an Elastic stream and its configuration.
    params:
      confirmation_body: User confirmation for deletion
      name: Stream name to delete
  - name: platform_streams_design_pipeline
    description: Design a stream-processing pipeline from a natural-language requirement.
    params:
      instruction: Pipeline design instruction
      samples: Sample documents for pipeline design
      stream_name: Stream to design a pipeline for
  - name: platform_streams_diagnose_stream
    description: Analyze an Elastic stream for data-quality or health problems.
    params:
      name: Stream name to diagnose
      time_range: Time range to inspect
  - name: platform_streams_inspect_streams
    description: Inspect stream schemas, lifecycle, quality, processing, or routing settings.
    params:
      aspects: Stream aspects to inspect
      names: Stream names to inspect
  - name: platform_streams_list_ilm_policies
    description: List available index lifecycle management policies.
    params: {}
  - name: platform_streams_query_documents
    description: Search or aggregate documents within an Elastic stream.
    params:
      name: Stream name to query
      query: Natural language query request
      source: Stream data source to query
  - name: platform_streams_update_stream
    description: Change the configuration of an existing Elastic stream.
    params:
      changes: Stream configuration changes
      confirmation_body: User confirmation for the change
      name: Stream name to update
  - name: platform_workflows_get_connectors
    description: List connectors available to Elastic workflows.
    params:
      actionTypeId: Connector action type ID to filter by
      search: Connector search query
      stepType: Workflow step type to filter by
  - name: platform_workflows_get_examples
    description: Find example Elastic workflow definitions in YAML.
    params:
      category: Example category to filter by
      limit: Maximum number of examples to return
      search: Example search query
  - name: platform_workflows_get_step_definitions
    description: Retrieve supported workflow steps and their configuration schemas.
    params:
      category: Step category to filter by
      includeDeprecated: Whether to include deprecated steps
      includeFullSchema: Whether to include complete step schemas
      includeOutputSummary: Whether to include output summaries
      search: Step definition search query
      stepType: Step type to retrieve
  - name: platform_workflows_get_trigger_definitions
    description: Retrieve supported workflow triggers and their configuration schemas.
    params:
      triggerType: Trigger type to retrieve
  - name: platform_workflows_validate_workflow
    description: Check an Elastic workflow YAML definition for errors.
    params:
      yaml: Workflow YAML to validate
  - name: platform_workflows_workflow_execute_step
    description: Run one workflow step to test its behavior.
    params:
      confirmation_body: User confirmation for a side-effecting step
      contextOverride: Context used when executing the step
      stepName: Name of the step to execute
      yaml: Workflow YAML containing the step
