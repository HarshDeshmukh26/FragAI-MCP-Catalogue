name: Linear
entryKey: fragai-linear
shortDescription: Search and manage Linear issues, projects, documents, comments, and planning data
description: |
  Connect FragAI to Linear's hosted MCP server to work with product and engineering workflows using the signed-in user's permissions.

  ## What you can do
  - Search, create, and update issues
  - Review or manage projects, cycles, statuses, labels, and teams
  - Retrieve Linear documents and workspace users
  - Read and add issue comments
  - Search Linear product documentation

  ## Before connecting
  - Sign in through Linear OAuth
  - Workspace and team permissions determine available data and actions
  - Require confirmation before creating or changing issues, projects, or comments

  Setup details: [Linear MCP announcement and documentation](https://linear.app/changelog/2025-05-01-mcp).
metadata:
  categories: Project Management, Developer Tools
icon: https://avatars.githubusercontent.com/u/46686594?s=200&v=4
repoURL: https://linear.app/changelog/2025-05-01-mcp
runtime: remote
remoteConfig:
  fixedURL: https://mcp.linear.app/mcp
toolPreview:
  - name: list_comments
    description: List comments posted on a selected Linear issue.
    params:
      issueId: ID of the issue to list comments for
  - name: create_comment
    description: Post a new comment on a selected Linear issue.
    params:
      body: Content of the comment
      issueId: ID of the issue to comment on
      parentId: ID of parent comment for replies (optional)
  - name: list_cycles
    description: List planning cycles for a Linear team.
    params:
      teamId: ID of the team to list cycles for
      type: Type of cycles to filter by (optional)
  - name: get_document
    description: Retrieve a Linear document by its identifier or slug.
    params:
      id: Document ID or slug
  - name: list_documents
    description: List documents available in the connected Linear workspace.
    params:
      after: Cursor for pagination (optional)
      before: Cursor for pagination (optional)
      createdAt: Filter by creation date (optional)
      creatorId: Filter by creator ID (optional)
      includeArchived: Include archived documents (optional)
      initiativeId: Filter by initiative ID (optional)
      limit: Maximum number of results (optional)
      orderBy: Sort order (optional)
      projectId: Filter by project ID (optional)
      query: Search query (optional)
      updatedAt: Filter by update date (optional)
  - name: get_issue
    description: Retrieve issue details, attachments, and the suggested Git branch name.
    params:
      id: Issue ID
  - name: list_issues
    description: Find issues in the connected Linear workspace using filters.
    params:
      after: Cursor for pagination (optional)
      assigneeId: Filter by assignee ID (optional)
      before: Cursor for pagination (optional)
      createdAt: Filter by creation date (optional)
      cycleId: Filter by cycle ID (optional)
      delegateId: Filter by delegate ID (optional)
      includeArchived: Include archived issues (optional)
      limit: Maximum number of results (optional)
      orderBy: Sort order (optional)
      parentId: Filter by parent issue ID (optional)
      projectId: Filter by project ID (optional)
      query: Search query (optional)
      stateId: Filter by state ID (optional)
      teamId: Filter by team ID (optional)
      updatedAt: Filter by update date (optional)
  - name: create_issue
    description: Create a Linear issue in a selected team.
    params:
      teamId: ID of the team to create issue in
      title: Issue title
      assigneeId: ID of the assignee (optional)
      cycleId: ID of the cycle (optional)
      delegateId: ID of the delegate (optional)
      description: Issue description (optional)
      dueDate: Due date (optional)
      labelIds: Array of label IDs (optional)
      links: Array of links with title and url (optional)
      parentId: ID of parent issue (optional)
      priority: Priority level (optional)
      projectId: ID of the project (optional)
      stateId: ID of the state (optional)
  - name: update_issue
    description: Change the fields or status of an existing Linear issue.
    params:
      id: Issue ID
      assigneeId: ID of the assignee (optional)
      cycleId: ID of the cycle (optional)
      delegateId: ID of the delegate (optional)
      description: Issue description (optional)
      dueDate: Due date (optional)
      estimate: Effort estimate (optional)
      labelIds: Array of label IDs (optional)
      links: Array of links with title and url (optional)
      parentId: ID of parent issue (optional)
      priority: Priority level (optional)
      projectId: ID of the project (optional)
      stateId: ID of the state (optional)
      title: Issue title (optional)
  - name: list_issue_statuses
    description: List the issue statuses configured for a Linear team.
    params:
      teamId: ID of the team
  - name: get_issue_status
    description: Retrieve one issue status by name or identifier.
    params:
      query: Status name or ID
      teamId: ID of the team
  - name: list_my_issues
    description: List issues assigned to the connected Linear user.
    params:
      after: Cursor for pagination (optional)
      before: Cursor for pagination (optional)
      limit: Maximum number of results (optional)
      orderBy: Sort order (optional)
  - name: list_issue_labels
    description: List issue labels available in a Linear team or workspace.
    params:
      teamId: ID of the team to filter by (optional)
  - name: list_projects
    description: List projects in the connected Linear workspace.
    params:
      after: Cursor for pagination (optional)
      before: Cursor for pagination (optional)
      createdAt: Filter by creation date (optional)
      includeArchived: Include archived projects (optional)
      limit: Maximum number of results (optional)
      orderBy: Sort order (optional)
      teamId: Filter by team ID (optional)
      updatedAt: Filter by update date (optional)
  - name: get_project
    description: Retrieve the details of one Linear project.
    params:
      query: Project name or ID
  - name: create_project
    description: Create a project in the connected Linear workspace.
    params:
      name: Project name
      teamId: ID of the team
      description: Project description (optional)
      labelIds: Array of label IDs (optional)
      leadId: ID of the project lead (optional)
      startDate: Start date (optional)
      summary: Project summary (optional)
      targetDate: Target completion date (optional)
  - name: update_project
    description: Change the properties of an existing Linear project.
    params:
      id: Project ID
      description: Project description (optional)
      labelIds: Array of label IDs (optional)
      leadId: ID of the project lead (optional)
      name: Project name (optional)
      startDate: Start date (optional)
      summary: Project summary (optional)
      targetDate: Target completion date (optional)
  - name: list_project_labels
    description: List project labels configured in the Linear workspace.
  - name: list_teams
    description: List teams available to the connected Linear user.
    params:
      after: Cursor for pagination (optional)
      before: Cursor for pagination (optional)
      createdAt: Filter by creation date (optional)
      includeArchived: Include archived teams (optional)
      limit: Maximum number of results (optional)
      orderBy: Sort order (optional)
      query: Search query (optional)
      updatedAt: Filter by update date (optional)
  - name: get_team
    description: Retrieve the details of one Linear team.
    params:
      query: Team name or ID
  - name: list_users
    description: List users in the connected Linear workspace.
  - name: get_user
    description: Retrieve the profile of one Linear user.
    params:
      query: User name, email, or ID
  - name: search_documentation
    description: Search official Linear documentation for product guidance.
    params:
      query: Search query
      page: Page number for pagination (optional)
