name: Pylon
entryKey: fragai-pylon
shortDescription: Search, manage, and resolve customer support issues
description: |
  Search and manage Pylon customer-support issues, accounts, contacts, and conversations from an AI client.

  ## What you can do
  - Find customer issues, accounts, contacts, messages, and related support context
  - Read the details and conversation history needed to investigate a customer problem
  - Create or update supported issues and account information
  - Use support evidence in debugging, customer analysis, and product-planning workflows

  ## Before connecting
  - Sign in through Pylon OAuth with a Member or Admin seat; Viewer and Integration users cannot connect
  - Pylon does not currently support API keys or machine-to-machine authentication for its MCP server
  - The connection reads and writes with your existing Pylon permissions, so confirm issue and account identifiers before approving changes
  - Notebook block content is not currently available through this server

  See the official [Pylon MCP documentation](https://support.usepylon.com/articles/2407390554-connecting-to-the-pylon-mcp-server) for supported clients, authentication, and current limitations.
