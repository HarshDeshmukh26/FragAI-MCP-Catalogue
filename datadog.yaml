name: Datadog
entryKey: fragai-datadog
shortDescription: Investigate Datadog logs, metrics, traces, incidents, and dashboards
upgradeNote: |
  This entry now uses Datadog's hosted US1 MCP endpoint. Existing users must reconnect with Datadog OAuth or an optional personal or service access token. The former API key, application key, and site settings no longer apply, and tool names or permissions may differ.
description: |
  Connect FragAI to Datadog's official hosted MCP server to investigate observability and operational data using the access of the connected Datadog identity.

  ## What you can do
  - Search logs, metrics, traces, events, hosts, services, monitors, incidents, dashboards, notebooks, and RUM data
  - Aggregate telemetry and retrieve detailed records for investigations
  - Load Datadog guidance for common operational workflows
  - Use additional product toolsets when enabled by your Datadog administrator

  ## Before connecting
  - This catalogue entry uses Datadog US1 and is not intended for GovCloud; use the correct regional endpoint if your account is hosted elsewhere
  - Prefer OAuth and grant the user `mcp_read`, `mcp_write` only when required, plus the underlying resource permissions
  - Use a personal or service access token only for non-interactive scenarios and keep it narrowly scoped
  - Review Datadog's documented usage limits and data-retention terms before sending sensitive investigation context

  Some enabled tools can create or update Datadog resources. Require approval for write actions. Setup details: [Datadog MCP documentation](https://docs.datadoghq.com/mcp_server/).
