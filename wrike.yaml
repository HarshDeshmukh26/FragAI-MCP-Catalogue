name: Wrike
entryKey: fragai-wrike
shortDescription: Search and manage Wrike tasks, projects, folders, and comments
description: |
  Search Wrike and create or update tasks, projects, folders, assignments, dates, comments, and other shared work.

  ## What you can do
  - Search tasks, projects, folders, spaces, contacts, custom fields, and workflows
  - Create or update tasks, assignments, dates, comments, folders, and projects
  - Apply supported bulk actions and convert meeting notes into tracked work
  - Review overdue or urgent work and report project status
  - Navigate workspace structures for team onboarding

  ## Before connecting
  - This catalogue entry requires a Wrike Permanent Access Token generated from a Wrike app; Wrike recommends OAuth for interactive clients that configure the official flow separately
  - Access and writes follow the authenticated Wrike user's existing permissions
  - Tokens are sensitive credentials and should be scoped, stored, and rotated appropriately
  - Confirm workspace, project, folder, task, assignees, dates, and bulk scope before approval

  See the official [Wrike MCP documentation](https://developers.wrike.com/docs/wrike-mcp-server-overview) for authentication, permissions, and tools.
