name: GitHub Enterprise Cloud
entryKey: fragai-github-enterprise-cloud
shortDescription: Connect FragAI to a GitHub Enterprise Cloud data-residency tenant
description: |
  Connect FragAI to GitHub's hosted MCP endpoint for a GitHub Enterprise Cloud tenant on `ghe.com`. OAuth and the tenant's policies determine access.

  ## What you can do
  - Search and inspect repositories, code, commits, issues, pull requests, releases, and users
  - Work with Actions, notifications, discussions, projects, labels, and gists
  - Review code scanning, secret scanning, Dependabot, quality findings, and security advisories
  - Create or update GitHub resources when the selected toolsets and user permissions allow it

  ## Before connecting
  - Enter only the tenant subdomain, such as `octocorp` for `https://octocorp.ghe.com`
  - Configure the required GitHub OAuth application and FragAI redirect URI
  - Optionally restrict the connection to a comma-separated set of toolsets
  - Require confirmation before commits, merges, workflow runs, repository changes, or destructive actions

  Setup details: [GitHub Enterprise MCP documentation](https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/provide-context/use-mcp-in-your-ide/enterprise-configuration).
config:
  - key: GITHUB_ENTERPRISE_SUBDOMAIN
    name: GitHub Enterprise Cloud Subdomain
    required: true
    sensitive: false
    description: Tenant subdomain only, such as octocorp for https://octocorp.ghe.com
    usage: env
  - name: GitHub Toolsets
    description: Optional comma-separated list of GitHub toolsets enabled for this tenant connection
    key: X-MCP-Toolsets
    required: false
    sensitive: false
    usage: header
metadata:
  categories: Developer Tools
icon: https://avatars.githubusercontent.com/u/9919?v=4
repoURL: https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/provide-context/use-mcp-in-your-ide/enterprise-configuration
runtime: remote
remoteConfig:
  urlTemplate: https://copilot-api.${GITHUB_ENTERPRISE_SUBDOMAIN}.ghe.com/mcp
  staticOAuthRequired: true
