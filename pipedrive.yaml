name: Pipedrive
entryKey: fragai-pipedrive
shortDescription: Search and update deals, contacts, leads, activities, and notes
description: |
  Search and update live Pipedrive CRM records, including deals, leads, people, organizations, activities, and notes.

  ## What you can do
  - Find and inspect deals, leads, contacts, organizations, and pipeline stages
  - Create and update supported CRM records
  - Convert leads into deals
  - Add notes and schedule or update follow-up activities

  ## Before connecting
  - Sign in to a paid Pipedrive account with access to the required CRM data
  - Reads and changes follow the connected user's Pipedrive permissions
  - Confirm record ownership, pipeline stage, dates, and related contacts before approving CRM updates

  See the official [Pipedrive MCP documentation](https://www.pipedrive.com/en/features/mcp-server) for availability, security, and supported workflows.
