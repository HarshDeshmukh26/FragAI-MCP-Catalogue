name: Stripe
entryKey: fragai-stripe
shortDescription: Process payments, manage subscriptions, invoices, customers, and disputes with Stripe
description: |
  Manage Stripe customers, products, prices, payments, subscriptions, invoices, refunds, disputes, and other commerce workflows.

  ## What you can do
  - Inspect the connected Stripe account and its available balance
  - Create and find customers, products, prices, coupons, invoices, and subscriptions
  - Create payment links and issue full or partial refunds
  - Finalize invoices, update or cancel subscriptions, and submit dispute evidence
  - Search Stripe resources and official documentation

  ## Before connecting
  - Sign in through Stripe OAuth and select the intended sandbox or live-mode account
  - Administrators can independently enable or disable MCP access for live mode and sandboxes
  - Financial tools can move money, create customer obligations, cancel subscriptions, or affect disputes
  - Test new workflows in a sandbox and verify account mode, customer, currency, amount, object ID, and idempotency behavior before approving live writes
  - Enable human confirmation and remain alert to prompt injection when Stripe is combined with untrusted data sources

  See the official [Stripe MCP documentation](https://docs.stripe.com/mcp) for authentication, permissions, tools, and security guidance.
metadata:
  categories: SaaS & API Integrations,Payments,Billing
icon: https://avatars.githubusercontent.com/u/856813?s=200&v=4
repoURL: https://docs.stripe.com/mcp
toolPreview:
  - name: get_stripe_account_info
    description: Retrieve identity and configuration details for the Stripe account authorized by the current connection.
    params: {}
  - name: retrieve_balance
    description: Retrieve the Stripe account balance, including available and pending funds by currency.
    params: {}
  - name: create_customer
    description: Create a Stripe customer with the supplied identity and contact details.
    params:
      name: The name of the customer
      email: The email address of the customer (optional)
  - name: list_customers
    description: List Stripe customers with optional email filtering and pagination.
    params:
      limit: Maximum number of customers to return (1-100)
      email: Filter customers by email address
  - name: create_product
    description: Create a product in the connected Stripe account.
    params:
      name: The name of the product
      description: Description of the product (optional)
  - name: list_products
    description: List Stripe products with optional pagination.
    params:
      limit: Maximum number of products to return (1-100)
  - name: create_price
    description: Create a one-time or recurring Stripe price for an existing product.
    params:
      product: The ID of the product to create the price for
      unit_amount: The price amount in currency minor units (e.g., cents)
      currency: The currency code (e.g., usd, eur)
      recurring: Recurring billing configuration (optional)
  - name: list_prices
    description: List Stripe prices, optionally limiting results to one product.
    params:
      product: Filter prices by product ID (optional)
      limit: Maximum number of prices to return (1-100)
  - name: create_payment_link
    description: Create a customer-facing Stripe payment link for selected products or prices.
    params:
      price: The ID of the price to create the payment link for
      quantity: The quantity of the product to include
  - name: list_payment_intents
    description: List Stripe PaymentIntents, optionally filtered to a customer.
    params:
      customer: Filter by customer ID (optional)
      limit: Maximum number of payment intents to return (1-100)
  - name: create_refund
    description: Issue a full or partial refund for an eligible Stripe payment.
    params:
      payment_intent: The ID of the payment intent to refund
      amount: Amount to refund in minor currency units (optional, defaults to full refund)
      reason: Reason for refund - duplicate, fraudulent, or requested_by_customer (optional)
  - name: create_invoice
    description: Create a draft Stripe invoice for a selected customer.
    params:
      customer: The ID of the customer to invoice
      days_until_due: Number of days until invoice is due (optional)
  - name: list_invoices
    description: List Stripe invoices, optionally filtered to a customer.
    params:
      customer: Filter by customer ID (optional)
      limit: Maximum number of invoices to return (1-100)
  - name: create_invoice_item
    description: Add a priced line item to a Stripe customer or draft invoice.
    params:
      customer: The ID of the customer
      price: The ID of the price for the line item
      invoice: The ID of the invoice to add the item to
  - name: finalize_invoice
    description: Finalize a draft Stripe invoice so it can be collected or sent for payment.
    params:
      invoice: The ID of the invoice to finalize
  - name: list_subscriptions
    description: List Stripe subscriptions using the requested customer, status, and pagination filters.
    params:
      customer: Filter by customer ID (optional)
      price: Filter by price ID (optional)
      status: Filter by subscription status (optional)
      limit: Maximum number of subscriptions to return (1-100)
  - name: cancel_subscription
    description: Cancel an active Stripe subscription and apply the requested cancellation behavior.
    params:
      subscription: The ID of the subscription to cancel
  - name: update_subscription
    description: Change an existing Stripe subscription, including its items, price, quantity, or billing behavior.
    params:
      subscription: The ID of the subscription to update
      items: Array of subscription items to add, modify, or remove
      proration_behavior: How to handle prorations (optional)
  - name: create_coupon
    description: Create a Stripe coupon with a percentage or fixed-amount discount and optional duration limits.
    params:
      name: Display name of the coupon
      percent_off: Percentage discount (0-100, use either this or amount_off)
      amount_off: Fixed amount discount in minor currency units (use either this or percent_off)
      currency: Currency for amount_off (required if using amount_off)
      duration: How long discount lasts - once, repeating, or forever (optional)
      duration_in_months: Months for repeating duration (optional)
  - name: list_coupons
    description: List discount coupons available in the connected Stripe account.
    params:
      limit: Maximum number of coupons to return (1-100)
  - name: list_disputes
    description: List Stripe payment disputes using optional status and pagination filters.
    params:
      charge: Filter by specific charge ID (optional)
      payment_intent: Filter by payment intent ID (optional)
      limit: Maximum number of disputes to return (1-100)
  - name: update_dispute
    description: Update a Stripe dispute or submit supporting evidence for review.
    params:
      dispute: The ID of the dispute to update
      evidence: Evidence object with supporting documentation
      submit: Whether to immediately submit evidence to the bank (optional)
  - name: search_stripe_resources
    description: Search supported Stripe resource types with the resource-search query syntax.
    params:
      query: Search query in format 'resource:query_clause' (e.g., 'customers:email:"john@example.com"')
  - name: fetch_stripe_resources
    description: Retrieve full details for a supported Stripe object by its resource type and ID.
    params:
      id: The Stripe object ID (e.g., cus_123, pi_456, sub_789)
  - name: search_stripe_documentation
    description: Search Stripe documentation and support content for implementation or product guidance.
    params:
      question: Your question about Stripe integration or API usage
      language: Programming language context (optional)
      search_only_api_ref: Whether to search only API reference docs (optional)

runtime: remote
remoteConfig:
  fixedURL: https://mcp.stripe.com
