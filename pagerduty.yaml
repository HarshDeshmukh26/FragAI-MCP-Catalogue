name: PagerDuty
entryKey: fragai-pagerduty
shortDescription: Manage PagerDuty incidents, on-call schedules, services, and incident response workflows
upgradeNote: |
  This replaces the FragAI-hosted PagerDuty server with PagerDuty's official hosted MCP server.

  - **Reconnect required:** Select the PagerDuty US or EU hosted endpoint and provide a PagerDuty User API token.
  - **Configuration change:** The previous API-host setting is replaced by a hosted-server region selection.
  - **Tool changes:** Tool names, parameters, and the available incident-response and administration operations change.
description: |
  Investigate incidents, manage on-call coverage, and administer PagerDuty services through PagerDuty's hosted MCP server.

  ## What you can do
  - Find and inspect incidents, alerts, notes, log entries, related incidents, and change events
  - Create, update, resolve, and coordinate incidents and responder workflows
  - Review schedules and on-call assignments and manage schedule overrides
  - Manage services, teams, escalation policies, event orchestrations, alert grouping, and status pages
  - Analyze operational history and service dependencies

  ## Before connecting
  - Select the US or EU endpoint that hosts your PagerDuty account
  - Create a PagerDuty User API token from My Profile > User Settings > API Access
  - The server acts with the permissions of that token and can change incident-response and administration data
  - Confirm incident, schedule, service, and team identifiers before approving write or delete operations, and rotate exposed tokens

  See the official [PagerDuty MCP documentation](https://support.pagerduty.com/main/docs/pagerduty-mcp-server) for regional endpoints, authentication, and available tools.

  > **Important upgrade notice**
  >
  > This entry replaces the former FragAI-hosted PagerDuty server with PagerDuty's official hosted server. Reconnect using the correct region and a PagerDuty User API token. Tool names, parameters, and available operations may differ from the previous integration.
metadata:
  categories: Monitoring & Observability, SaaS & API Integrations
icon: https://avatars.githubusercontent.com/u/766800?s=48&v=4
repoURL: https://support.pagerduty.com/main/docs/pagerduty-mcp-server
config:
  - name: PagerDuty region
    key: PAGERDUTY_MCP_HOST
    description: Choose the regional PagerDuty MCP hostname that matches the account location.
    required: true
    sensitive: false
    options:
      - name: US
        value: mcp.pagerduty.com
        description: Use the United States-hosted PagerDuty MCP service.
      - name: EU
        value: mcp.eu.pagerduty.com
        description: Use the Europe-hosted PagerDuty MCP service.
    usage: env
  - name: PagerDuty API Key
    description: Enter a PagerDuty User API token created under My Profile > User Settings > API Access.
    key: Authorization
    required: true
    sensitive: true
    prefix: Token token=
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: https://${PAGERDUTY_MCP_HOST}/mcp
