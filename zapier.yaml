name: Zapier
entryKey: fragai-zapier
shortDescription: Access 30,000+ actions across 8,000+ apps in Zapier automation platform
description: |
  Run selected Zapier actions across connected applications through a personal Zapier MCP server.

  ## What you can do
  - Expose approved actions from supported Zapier applications
  - Read information from connected services
  - Create or update records, send messages, and trigger workflows when those actions are enabled
  - Combine actions across applications in an AI-assisted workflow

  ## Before connecting
  - Create a Zapier account and configure a personal MCP server with only the actions you need
  - Connect using the OAuth URL generated by Zapier
  - Each enabled action inherits the permissions and side effects of its underlying application
  - Actions may send messages, change records, trigger automation, spend money, or expose sensitive data
  - Use least privilege and confirm the app, account, action, inputs, recipients, and expected downstream effects before approval

  See the official [Zapier MCP documentation](https://zapier.com/mcp) for setup and available applications.
