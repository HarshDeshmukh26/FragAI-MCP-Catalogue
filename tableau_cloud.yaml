name: Tableau Cloud
entryKey: fragai-tableau-cloud
shortDescription: Query Tableau Cloud data, explore content, and manage Pulse metrics with OAuth
description: |
  Query published Tableau Cloud data, explore workbooks and views, and work with Tableau Pulse metrics using your existing Tableau identity.

  ## What you can do
  - Discover published data sources and inspect fields, relationships, and parameters
  - Query data through VizQL Data Service
  - Search workbooks, views, projects, custom views, databases, and tables
  - Retrieve view data or rendered images
  - Explore Pulse metrics, subscriptions, insight bundles, and Tableau+ briefs
  - Access administrative tools when site settings and permissions allow them

  ## Before connecting
  - Sign in through Tableau OAuth; tool calls follow the connected user's site role and content permissions
  - Tableau's hosted endpoint supports Tableau Cloud, not Tableau Server or self-hosted deployments
  - Queries can expose governed business data, and consent or token tools affect future access
  - Confirm the Tableau site, data source, filters, row limits, and administrative intent before approval

  See the official [Tableau hosted MCP documentation](https://tableau.github.io/tableau-mcp/docs/hosted-tableau-mcp) for supported capabilities and limitations.
metadata:
  categories: Data Analytics, Business Intelligence, Visualization

icon: https://avatars.githubusercontent.com/u/828667?s=48&v=4
repoURL: https://tableau.github.io/tableau-mcp/docs/hosted-tableau-mcp
runtime: remote
remoteConfig:
  fixedURL: https://mcp.tableau.com

toolPreview:
  - name: list-datasources
    description: List published data sources visible to the connected Tableau Cloud user.
    params:
      filter: Optional REST filter in field:operator:value format.
      limit: Maximum number of results to return.
      pageNumber: Page number to retrieve.
  - name: get-datasource-metadata
    description: Retrieve a Tableau data source description, fields, parameters, and model relationships.
    params:
      datasourceLuid: LUID of the datasource to inspect.
  - name: query-datasource
    description: Run a VizQL Data Service query against a published Tableau Cloud data source.
    params:
      datasourceLuid: LUID of the datasource to query.
      query: VizQL query with fields, filters, aggregations, sorting, and parameters.
      limit: Maximum number of rows to return.
  - name: list-workbooks
    description: List Tableau Cloud workbooks visible to the connected user.
    params:
      filter: Optional REST filter in field:operator:value format.
      limit: Maximum number of results to return.
      pageNumber: Page number to retrieve.
  - name: get-workbook
    description: Retrieve metadata for one Tableau workbook and its included views.
    params:
      workbookId: ID of the workbook to retrieve.
  - name: list-views
    description: List Tableau views with their workbook and owner information.
    params:
      filter: Optional REST filter in field:operator:value format.
      limit: Maximum number of results to return.
      pageNumber: Page number to retrieve.
  - name: get-view
    description: Retrieve metadata for one Tableau workbook view.
    params:
      viewId: ID of the view to retrieve.
  - name: get-view-data
    description: Export the accessible data behind a Tableau view as CSV.
    params:
      viewId: ID of the view to retrieve.
      viewFilters: Optional filters to apply to the view.
  - name: get-view-image
    description: Render and retrieve an image of a Tableau view.
    params:
      viewId: ID of the view to render.
      width: Image width in pixels.
      height: Image height in pixels.
      format: Image format.
      viewFilters: Optional filters to apply to the view.
  - name: list-custom-views
    description: List saved custom views for a Tableau workbook.
    params:
      workbookId: ID of the workbook.
      filter: Optional REST filter in field:operator:value format.
      limit: Maximum number of results to return.
  - name: get-custom-view-data
    description: Export the accessible data behind a saved Tableau custom view as CSV.
    params:
      customViewId: ID of the custom view.
      viewFilters: Optional filters to apply to the view.
  - name: get-custom-view-image
    description: Render and retrieve an image of a saved Tableau custom view.
    params:
      customViewId: ID of the custom view.
      width: Image width in pixels.
      height: Image height in pixels.
      format: Image format.
      viewFilters: Optional filters to apply to the view.
  - name: list-projects
    description: List Tableau projects visible on the connected Cloud site.
    params:
      filter: Optional REST filter in field:operator:value format.
      limit: Maximum number of results to return.
      pageNumber: Page number to retrieve.
  - name: list-all-pulse-metric-definitions
    description: List published Tableau Pulse metric definitions visible to the current user.
    params:
      view: Definition detail level.
      limit: Maximum number of results to return.
      pageSize: Number of items per page.
  - name: list-pulse-metric-definitions-from-definition-ids
    description: Retrieve selected Tableau Pulse metric definitions by their IDs.
    params:
      metricDefinitionIds: Pulse metric definition IDs.
      view: Definition detail level.
  - name: list-pulse-metrics-from-metric-definition-id
    description: List Tableau Pulse metrics created from one metric definition.
    params:
      pulseMetricDefinitionID: ID of the Pulse metric definition.
  - name: list-pulse-metrics-from-metric-ids
    description: Retrieve selected Tableau Pulse metrics by their IDs.
    params:
      metricIds: Pulse metric IDs.
  - name: list-pulse-metric-subscriptions
    description: List Tableau Pulse metrics to which the current user is subscribed.
  - name: generate-pulse-metric-value-insight-bundle
    description: Generate an explanatory insight bundle for a selected Tableau Pulse metric value.
    params:
      bundleRequest: Request containing the metric and insight context.
      bundleType: Insight bundle type.
  - name: generate-pulse-insight-brief
    description: Generate an AI-assisted Tableau Pulse Insight Brief for selected metrics. Requires Tableau+.
    params:
      briefRequest: Request containing conversation and metric context.
  - name: search-content
    description: Search accessible Tableau workbooks, views, data sources, databases, and tables.
    params:
      terms: Terms to search for.
      limit: Maximum number of results to return.
      orderBy: Sorting configuration.
      filter: Content type, owner, or modification-time filters.
  - name: reset-consent
    description: Clear stored Tableau MCP consent for the current user so authorization can be requested again.
  - name: revoke-access-token
    description: Revoke the current Tableau MCP access token and end its authorized access.
