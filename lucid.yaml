name: Lucid
entryKey: fragai-lucid
shortDescription: Search, summarize, create, export, and share Lucid documents
description: |
  Connect FragAI to Lucid's hosted MCP server to work with permitted Lucidchart and Lucidspark content.

  ## What you can do
  - Search, retrieve, and summarize Lucid documents
  - Create flowcharts, mind maps, organization charts, and sequence diagrams
  - Export diagrams and create share links
  - Share documents with selected collaborators

  ## Before connecting
  - Sign in to Lucid through OAuth
  - Team or Enterprise administrators must enable MCP in Lucid AI controls when required
  - Verify document permissions and recipients before exporting or sharing content

  Setup details: [Lucid MCP documentation](https://help.lucid.co/hc/en-us/articles/42578801807508-Integrate-Lucid-with-AI-tools-using-the-Lucid-MCP-server).
