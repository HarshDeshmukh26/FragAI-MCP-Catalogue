name: Files.com
entryKey: fragai-files-dot-com
shortDescription: Administer files, sharing, users, permissions, and audit records in Files.com
upgradeNote: |
  This entry now uses Files.com's official hosted MCP server. Existing users must reconnect with their Files.com site subdomain and either OAuth or an optional API key. An administrator must enable MCP Dynamic Client Registration for OAuth. Custom domains and local upload or download tools are not supported, and tool parameters may differ.
description: |
  Connect FragAI to a Files.com site's hosted MCP endpoint to manage permitted content and administrative resources without running a local MCP server.

  ## What you can do
  - Find, copy, move, delete, list, zip, and unzip files or folders
  - Manage users, groups, folder permissions, and secure share links
  - Inspect activity history, authentication events, transfers, automations, and other audit logs
  - Review automation and remote-server configuration

  ## Before connecting
  - Enter the Files.com site subdomain, such as `acme` for `https://acme.files.com`; custom domains are not accepted
  - For OAuth, enable AI features and MCP Dynamic Client Registration in the site's AI settings
  - For headless access, provide an optional API key belonging to a least-privilege Files.com user
  - Require explicit approval for file deletion, movement, sharing, permission changes, and user or group administration

  This hosted server does not provide local file upload or download tools. Setup details: [Files.com MCP documentation](https://www.files.com/docs/ai/model-context-protocol-mcp-server).
metadata:
  categories: Cloud & Infrastructure, File Transfer, Storage, Security & Compliance
  allow-multiple: "true"
  unsupportedTools: Download_File_to_Local,Upload_File_from_Local
icon: https://avatars.githubusercontent.com/u/59619169?s=48&v=4
repoURL: https://www.files.com/docs/integrations/model-context-protocol-mcp-server
config:
  - key: FILES_COM_SITE
    name: Files.com Site
    required: true
    sensitive: false
    description: Site subdomain only, such as acme for https://acme.files.com
    usage: env
  - name: Files.com API Key
    description: Optional API key for a least-privilege Files.com user, used instead of OAuth
    key: X-FilesAPI-Key
    required: false
    sensitive: true
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: https://${FILES_COM_SITE}.files.com/api/ai/mcp/v1
