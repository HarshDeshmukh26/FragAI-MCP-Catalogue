name: Peec AI
entryKey: fragai-peec-ai
shortDescription: Analyze brand visibility, sentiment, and share of voice across AI search
description: |
  Measure how often and how favorably AI search engines mention your brand with Peec AI.

  ## What you can do
  - List the projects, brands, prompts, topics, and tags available to your account
  - Retrieve brand, domain, and URL performance reports
  - Compare visibility, sentiment, and share of voice across supported AI search engines

  ## Before connecting
  - Use a Peec AI account with access to the projects you want to analyze
  - Connect with OAuth 2.0, or use a personal access token when your MCP client cannot complete OAuth
  - Treat visibility and sentiment metrics as directional analytics and review the underlying prompts and reports before making decisions

  See the official [Peec AI MCP documentation](https://docs.peec.ai/mcp/introduction) for supported clients and authentication options.
