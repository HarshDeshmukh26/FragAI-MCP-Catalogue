name: Monday.com
entryKey: fragai-monday-dot-com
shortDescription: Manage monday.com boards, items, forms, dashboards, workflows, and collaboration
upgradeNote: |
  This entry now uses monday.com's Streamable HTTP endpoint instead of the legacy SSE transport. Existing users may need to reconnect. Tools can change as monday.com updates the hosted service, while every call continues to use the connected user's permissions.
description: |
  Connect FragAI to monday.com's hosted MCP server to work with collaboration and work-management resources available to the signed-in user.

  ## What you can do
  - Read or manage boards, items, columns, groups, updates, forms, workspaces, and documents
  - Build dashboards, views, widgets, charts, and tables
  - Create and run automations, workflows, actions, and supported agent capabilities
  - Search meetings, knowledge, assets, users, teams, and account context
  - Use monday.com development and sprint-planning tools when available

  ## Before connecting
  - Ask a monday.com administrator to enable the hosted AI Connector when required
  - Sign in through OAuth; use a personal token only for approved development or testing
  - User, workspace, board, and app-scope permissions limit every tool call
  - Require explicit confirmation before creating or changing boards, items, forms, workspaces, automations, workflows, notifications, actions, publications, or deletions

  Setup details: [monday.com MCP documentation](https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp).
metadata:
  categories: Business, Project Management, Productivity
  allow-multiple: "true"
icon: https://avatars.githubusercontent.com/u/61420283?s=48&v=4
repoURL: https://developer.monday.com/api-reference/docs/integrate-with-monday-mcp
