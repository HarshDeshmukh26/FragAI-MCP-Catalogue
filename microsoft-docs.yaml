name: Microsoft Learn
entryKey: fragai-microsoft-learn
shortDescription: Search current Microsoft Learn documentation and official code samples
description: |
  Connect FragAI to Microsoft's public Learn MCP server for current product documentation and official code examples.

  ## What you can do
  - Search Microsoft Learn and other official Microsoft documentation
  - Find official code samples with language-specific filters
  - Retrieve a complete Microsoft Learn page as Markdown when search excerpts are insufficient

  ## Before connecting
  - No account or API key is required
  - Use focused queries to reduce irrelevant results
  - Check version, platform, and publication context before applying code or operational guidance

  Project details: [Microsoft Learn MCP repository](https://github.com/microsoftdocs/mcp).
metadata:
  categories: Documentation, Developer Tools
icon: https://avatars.githubusercontent.com/u/22479449?s=48&v=4
repoURL: https://github.com/microsoftdocs/mcp
runtime: remote
remoteConfig:
  fixedURL: https://learn.microsoft.com/api/mcp
toolPreview:
  # Documentation Search
  - name: microsoft_docs_search
    description: Search official Microsoft documentation and return the most relevant excerpts and source links.
    params:
      query: "A query or topic about Microsoft/Azure products, services, platforms, developer tools, frameworks, or APIs"

  # Code Sample Search
  - name: microsoft_code_sample_search
    description: Find implementation examples in official Microsoft documentation, optionally filtered by language.
    params:
      query: "A descriptive query, SDK name, method name or code snippet related to Microsoft/Azure products, services, platforms, developer tools, frameworks, APIs or SDKs"
      language: "Optional parameter specifying the programming language of code snippets to retrieve. Can significantly improve search quality if provided. Eligible values: csharp, javascript, typescript, python, powershell, azurecli, al, sql, java, kusto, cpp, go, rust, ruby, php"

  # Full Documentation Fetch
  - name: microsoft_docs_fetch
    description: Retrieve the complete current content of a Microsoft Learn page as Markdown.
    params:
      url: "URL of the Microsoft documentation page to read (must be a valid link from the microsoft.com domain)"
