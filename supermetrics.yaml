name: Supermetrics Marketing Analytics
entryKey: fragai-supermetrics-marketing-analytics
shortDescription: Analyze marketing data and manage campaigns across many platforms
description: |
  Analyze marketing data and manage supported campaigns across advertising, analytics, CRM, e-commerce, email, and social platforms.

  ## What you can do
  - Discover connected data sources, accounts, metrics, and dimensions
  - Query and compare marketing-performance data
  - Create, retrieve, and update supported advertising campaigns
  - Create and share live marketing dashboards

  ## Before connecting
  - Sign in through Supermetrics OAuth; an account can be created during authorization when supported
  - Available connectors, data, write actions, quotas, and costs depend on your Supermetrics plan and connected platforms
  - Campaign changes can affect advertising spend and customer-facing delivery
  - Confirm platform, account, campaign, budget, audience, dates, and dashboard-sharing settings before writes

  See the official [Supermetrics MCP documentation](https://mcp.supermetrics.com/docs) for current tools and access requirements.
