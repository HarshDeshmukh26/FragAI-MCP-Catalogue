toolPreview:
  - name: fetch-entities
    description: Search for companies or professional contacts using business, location, role, seniority, technology, and other targeting filters.

  - name: enrich-business
    description: Enrich company records with available firmographic, technographic, business, and market information.

  - name: enrich-prospects
    description: Enrich professional contact records with available role, employment, profile, and business contact information.

  - name: match-business
    description: Match supplied company names, domains, or other identifiers to corresponding business records.

  - name: match-prospects
    description: Match supplied names, profiles, contact details, or employment information to corresponding professional records.

  - name: fetch-entities-statistics
    description: Calculate result counts and summary statistics for a proposed company or professional search before retrieving the complete dataset.

  - name: fetch-businesses-events
    description: Retrieve available business events and buying signals such as funding, hiring, leadership, or technology changes.

  - name: fetch-prospects-events
    description: Retrieve available events and changes associated with matched professional contacts.

  - name: get-dataset
    description: Retrieve a previously generated Vibe Prospecting dataset and its available results.

  - name: export-to-csv
    description: Export a generated prospecting dataset to a CSV file for authorized downstream use.

  - name: autocomplete
    description: Find supported values and suggestions for search filters when constructing a prospecting request.

  - name: estimate-cost
    description: Estimate the Vibe Prospecting credit cost of an operation before executing it.