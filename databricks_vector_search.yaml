name: Databricks Vector Search
entryKey: fragai-databricks-vector-search
shortDescription: Search approved Databricks vector indexes for semantically similar content
description: |
  Connect FragAI to a Databricks-managed Vector Search MCP endpoint for governed semantic retrieval from indexes in one Unity Catalog catalog and schema.

  ## What you can do
  - Discover vector search indexes available in the configured catalog and schema
  - Search indexed content using natural-language or similarity queries
  - Retrieve the most relevant records for an AI or analytics workflow

  ## Before connecting
  - Confirm managed MCP servers are enabled for the Databricks workspace
  - Obtain the workspace URL and choose the catalog and schema containing the approved indexes
  - Create a personal access token and store it securely
  - Grant the connected user only the Unity Catalog and Vector Search permissions required for the workflow

  Setup details: [Databricks managed MCP documentation](https://docs.databricks.com/aws/en/agents/mcp-tools).
metadata:
  categories: Data Analytics, Vector Search, Business Intelligence
icon: https://avatars.githubusercontent.com/u/4998052?s=200&v=4
repoURL: https://docs.databricks.com/aws/en/generative-ai/mcp/

config:
  - name: Databricks workspace hostname
    key: DATABRICKS_WORKSPACE_URL
    description: Full Databricks workspace URL, such as https://your-workspace.cloud.databricks.com
    required: true
    sensitive: false
    usage: env
  - name: Vector search catalog
    key: DATABRICKS_VECTOR_SEARCH_CATALOG
    description: Unity Catalog catalog containing the approved vector indexes
    required: true
    sensitive: false
    usage: env
  - name: Vector search schema
    key: DATABRICKS_VECTOR_SEARCH_SCHEMA
    description: Schema within the selected catalog that contains the approved indexes
    required: true
    sensitive: false
    usage: env
  - name: Personal Access Token
    description: Personal access token authorized to query the selected vector indexes
    key: Authorization
    required: true
    sensitive: true
    prefix: "Bearer "
    usage: header

runtime: remote
remoteConfig:
  urlTemplate: ${DATABRICKS_WORKSPACE_URL}/api/2.0/mcp/vector-search/${DATABRICKS_VECTOR_SEARCH_CATALOG}/${DATABRICKS_VECTOR_SEARCH_SCHEMA}
