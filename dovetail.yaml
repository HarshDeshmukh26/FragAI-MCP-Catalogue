name: Dovetail
entryKey: fragai-dovetail
shortDescription: Find customer-research projects, evidence, highlights, and insights in Dovetail
description: |
  Connect FragAI to Dovetail's remote MCP server to retrieve customer-research evidence available to the signed-in user.

  ## What you can do
  - Search accessible content across the Dovetail workspace
  - List projects and retrieve their research data
  - Review project highlights and insights
  - Fetch the full evidence behind a selected data point or insight

  ## Before connecting
  - Sign in through Dovetail OAuth
  - Use an account that can access the projects and customer data required for the task
  - Avoid placing sensitive participant information into prompts unless the workflow and organizational policy permit it

  Results remain limited by Dovetail workspace permissions. Setup details: [Dovetail MCP documentation](https://developers.dovetail.com/docs/mcp).
