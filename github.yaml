name: GitHub
entryKey: fragai-github
shortDescription: Work with GitHub repositories, issues, pull requests, Actions, and security data
upgradeNote: |
  This entry now requires a GitHub-hosted endpoint path. Existing users may need to reconnect and select a focused or read-only toolset; choose `/` for the default behavior. Authentication continues to use a GitHub personal access token.
description: |
  Connect FragAI to GitHub's hosted MCP server and choose the smallest toolset needed for the workflow.

  ## What you can do
  - Search repositories, code, commits, users, issues, and pull requests
  - Create or update branches, files, issues, reviews, and pull requests when write tools are enabled
  - Inspect Actions runs, releases, notifications, discussions, and projects
  - Review code scanning, secret scanning, Dependabot, and security-advisory information
  - Use remote-only Copilot and GitHub support-documentation tools where available

  ## Before connecting
  - Select a focused endpoint path or its read-only variant; use **Default** only when its standard toolsets are needed
  - Create a fine-grained personal access token with the minimum repository and organization permissions required
  - Require confirmation before commits, merges, workflow actions, issue changes, repository creation, or deletion operations

  Setup and toolset details: [GitHub remote MCP documentation](https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md).
toolPreview:
  - name: add_comment_to_pending_review
    description: Add an inline comment to the user's current pending pull-request review.
    params:
      body: The text of the review comment
      owner: Repository owner
      path: The relative path to the file that necessitates a comment
      pullNumber: Pull request number
      repo: Repository name
      subjectType: The level at which the comment is targeted
      line: The line of the blob in the pull request diff that the comment applies to (optional)
      side: The side of the diff to comment on (optional)
      startLine: For multi-line comments, the first line of the range (optional)
      startSide: For multi-line comments, the starting side of the diff (optional)
  - name: add_issue_comment
    description: Post a comment on a selected GitHub issue.
    params:
      body: Comment content
      issue_number: Issue number to comment on
      owner: Repository owner
      repo: Repository name
  - name: add_sub_issue
    description: Attach an existing issue beneath a parent issue.
    params:
      issue_number: The number of the parent issue
      owner: Repository owner
      repo: Repository name
      sub_issue_id: The ID of the sub-issue to add
      replace_parent: When true, replaces the sub-issue's current parent issue (optional)
  - name: assign_copilot_to_issue
    description: Assign a GitHub issue to the Copilot coding agent.
    params:
      issueNumber: Issue number
      owner: Repository owner
      repo: Repository name
  - name: cancel_workflow_run
    description: Cancel a GitHub Actions workflow run that is still active.
    params:
      owner: Repository owner
      repo: Repository name
      run_id: The unique identifier of the workflow run
  - name: create_and_submit_pull_request_review
    description: Create and immediately submit a pull-request review.
    params:
      body: Review comment text
      event: Review action to perform
      owner: Repository owner
      pullNumber: Pull request number
      repo: Repository name
      commitID: SHA of commit to review (optional)
  - name: create_branch
    description: Create a branch from the repository default or another selected branch.
    params:
      branch: Name for new branch
      owner: Repository owner
      repo: Repository name
      from_branch: Source branch (defaults to repo default) (optional)
  - name: create_gist
    description: Create a GitHub gist with the supplied file content.
    params:
      content: Gist content
      filename: Gist filename
      description: Gist description (optional)
      public: Whether gist should be public (optional)
  - name: create_issue
    description: Create an issue with optional labels, assignees, and milestone.
    params:
      owner: Repository owner
      repo: Repository name
      title: Issue title
      assignees: Usernames to assign to this issue (optional)
      body: Issue body content (optional)
      labels: Labels to apply to this issue (optional)
      milestone: Milestone number (optional)
  - name: create_or_update_file
    description: Commit a new or replacement file to a selected repository branch.
    params:
      branch: Branch to create/update the file in
      content: Content of the file
      message: Commit message
      owner: Repository owner (username or organization)
      path: Path where to create/update the file
      repo: Repository name
      sha: Required if updating an existing file. The blob SHA of the file being replaced (optional)
  - name: create_pending_pull_request_review
    description: Start a pull-request review without submitting it yet.
    params:
      owner: Repository owner
      pullNumber: Pull request number
      repo: Repository name
      commitID: SHA of commit to review (optional)
  - name: create_pull_request
    description: Open a new pull request between two branches.
    params:
      base: Branch to merge into
      head: Branch containing changes
      owner: Repository owner
      repo: Repository name
      title: PR title
      body: PR description (optional)
      draft: Create as draft PR (optional)
      maintainer_can_modify: Allow maintainer edits (optional)
  - name: create_pull_request_with_copilot
    description: Delegate a coding task to Copilot and ask it to open a pull request.
    params:
      owner: Repository owner
      problem_statement: Detailed description of the task to be performed
      repo: Repository name
      title: Title for the pull request that will be created
      base_ref: Git reference (e.g., branch) that the agent will start its work from (optional)
  - name: create_repository
    description: Create a repository in the authenticated GitHub account.
    params:
      name: Repository name
      autoInit: Initialize with README (optional)
      description: Repository description (optional)
      private: Whether repo should be private (optional)
  - name: delete_file
    description: Commit the deletion of a file from a repository branch.
    params:
      branch: Branch to delete the file from
      message: Commit message
      owner: Repository owner (username or organization)
      path: Path to the file to delete
      repo: Repository name
  - name: delete_pending_pull_request_review
    description: Discard the user's current pending pull-request review.
    params:
      owner: Repository owner
      pullNumber: Pull request number
      repo: Repository name
  - name: delete_workflow_run_logs
    description: Permanently remove logs from a GitHub Actions workflow run.
    params:
      owner: Repository owner
      repo: Repository name
      run_id: The unique identifier of the workflow run
  - name: dismiss_notification
    description: Mark a GitHub notification as read or done.
    params:
      threadID: The ID of the notification thread
      state: The new state of the notification (read/done) (optional)
  - name: download_workflow_run_artifact
    description: Generate a download URL for a workflow-run artifact.
    params:
      artifact_id: The unique identifier of the artifact
      owner: Repository owner
      repo: Repository name
  - name: fork_repository
    description: Fork a repository into the authenticated account or selected organization.
    params:
      owner: Repository owner
      repo: Repository name
      organization: Organization to fork to (optional)


metadata:
  categories: Developer Tools
  unsupportedTools: create_or_update_file,push_files
icon: https://avatars.githubusercontent.com/u/9919?v=4
repoURL: https://github.com/github/github-mcp-server

config:
  - name: GitHub MCP Endpoint Path
    key: GITHUB_MCP_PATH
    description: GitHub-hosted toolset and access mode exposed by this connection
    required: true
    sensitive: false
    options:
      - name: Default
        value: /
        description: GitHub's default context, issues, pull requests, repositories, and
          users toolsets.
      - name: Default (read-only)
        value: /readonly
        description: GitHub's default toolsets without tools that modify GitHub resources.
      - name: All
        value: /x/all
        description: All available GitHub MCP tools.
      - name: All (read-only)
        value: /x/all/readonly
        description: All available read-only GitHub MCP tools.
      - name: Actions
        value: /x/actions
        description: GitHub Actions workflows and CI/CD operations.
      - name: Actions (read-only)
        value: /x/actions/readonly
        description: Read GitHub Actions workflows and CI/CD information without
          modifying them.
      - name: Code Quality
        value: /x/code_quality
        description: GitHub Code Quality findings.
      - name: Code Quality (read-only)
        value: /x/code_quality/readonly
        description: Read GitHub Code Quality findings without modifying GitHub resources.
      - name: Code Security
        value: /x/code_security
        description: Code scanning and other code-security tools.
      - name: Code Security (read-only)
        value: /x/code_security/readonly
        description: Read code-security information without modifying GitHub resources.
      - name: Copilot
        value: /x/copilot
        description: GitHub Copilot coding-agent tools available on the remote server.
      - name: Copilot (read-only)
        value: /x/copilot/readonly
        description: Read-only GitHub Copilot tool access.
      - name: Copilot Issue Intents
        value: /x/copilot_issue_intents
        description: Opt-in Copilot issue-assignment tools with intent metadata.
      - name: Copilot Issue Intents (read-only)
        value: /x/copilot_issue_intents/readonly
        description: Read-only access to Copilot issue-intent tools.
      - name: Dependabot
        value: /x/dependabot
        description: Dependabot alerts and dependency tools.
      - name: Dependabot (read-only)
        value: /x/dependabot/readonly
        description: Read Dependabot alerts and dependency information without modifying
          them.
      - name: Discussions
        value: /x/discussions
        description: GitHub Discussions tools.
      - name: Discussions (read-only)
        value: /x/discussions/readonly
        description: Read GitHub Discussions without modifying them.
      - name: Gists
        value: /x/gists
        description: GitHub Gist tools.
      - name: Gists (read-only)
        value: /x/gists/readonly
        description: Read GitHub Gists without modifying them.
      - name: Git
        value: /x/git
        description: Low-level Git data operations.
      - name: Git (read-only)
        value: /x/git/readonly
        description: Read low-level Git data without modifying repositories.
      - name: Issues
        value: /x/issues
        description: GitHub Issues tools.
      - name: Issues (read-only)
        value: /x/issues/readonly
        description: Read GitHub Issues without modifying them.
      - name: Labels
        value: /x/labels
        description: GitHub Labels tools.
      - name: Labels (read-only)
        value: /x/labels/readonly
        description: Read GitHub Labels without modifying them.
      - name: Notifications
        value: /x/notifications
        description: GitHub Notifications tools.
      - name: Notifications (read-only)
        value: /x/notifications/readonly
        description: Read GitHub Notifications without changing their state.
      - name: Organizations
        value: /x/orgs
        description: GitHub Organization tools.
      - name: Organizations (read-only)
        value: /x/orgs/readonly
        description: Read GitHub Organization information without modifying it.
      - name: Projects
        value: /x/projects
        description: GitHub Projects tools.
      - name: Projects (read-only)
        value: /x/projects/readonly
        description: Read GitHub Projects without modifying them.
      - name: Pull Requests
        value: /x/pull_requests
        description: GitHub Pull Request tools.
      - name: Pull Requests (read-only)
        value: /x/pull_requests/readonly
        description: Read GitHub Pull Requests without modifying them.
      - name: Repositories
        value: /x/repos
        description: Repository and code operations.
      - name: Repositories (read-only)
        value: /x/repos/readonly
        description: Read repositories and code without modifying them.
      - name: Secret Protection
        value: /x/secret_protection
        description: Secret scanning and protection tools.
      - name: Secret Protection (read-only)
        value: /x/secret_protection/readonly
        description: Read secret-protection information without modifying GitHub resources.
      - name: Security Advisories
        value: /x/security_advisories
        description: Repository and global security-advisory tools.
      - name: Security Advisories (read-only)
        value: /x/security_advisories/readonly
        description: Read security advisories without modifying GitHub resources.
      - name: Stargazers
        value: /x/stargazers
        description: Repository stargazer information.
      - name: Stargazers (read-only)
        value: /x/stargazers/readonly
        description: Read repository stargazer information.
      - name: Users
        value: /x/users
        description: GitHub user profiles and related operations.
      - name: Users (read-only)
        value: /x/users/readonly
        description: Read GitHub user information without modifying it.
      - name: Copilot Spaces
        value: /x/copilot_spaces
        description: Remote-only GitHub Copilot Spaces tools.
      - name: Copilot Spaces (read-only)
        value: /x/copilot_spaces/readonly
        description: Read-only access to GitHub Copilot Spaces tools.
      - name: GitHub Support Docs Search
        value: /x/github_support_docs_search
        description: Search GitHub product and support documentation using the
          remote-only toolset.
      - name: GitHub Support Docs Search (read-only)
        value: /x/github_support_docs_search/readonly
        description: Read-only GitHub product and support documentation search.
    usage: env
  - name: Personal Access Token
    description: Fine-grained personal access token with only the required GitHub permissions
    key: Authorization
    required: true
    sensitive: true
    usage: header
runtime: remote
remoteConfig:
  urlTemplate: https://api.githubcopilot.com/mcp${GITHUB_MCP_PATH}
