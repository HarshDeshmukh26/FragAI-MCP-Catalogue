name: Hugging Face
entryKey: fragai-hugging-face
shortDescription: Find Hugging Face models, datasets, papers, documentation, and Spaces
description: |
  Connect FragAI to Hugging Face's official MCP server to discover Hub resources and supported Gradio applications.

  ## What you can do
  - Search and inspect models and datasets
  - Find research papers and Hugging Face documentation
  - Discover and use compatible Gradio Spaces
  - Inspect information about the authenticated Hugging Face account

  ## Before connecting
  - Sign in to Hugging Face through OAuth
  - Hub visibility and actions follow the connected account's permissions
  - Review model and dataset licenses, access restrictions, and usage requirements before adoption

  Connection details: [Hugging Face MCP settings](https://huggingface.co/settings/mcp).
metadata:
  categories: AI & Machine Learning, Developer Tools, Research
icon: https://huggingface.co/favicon.ico
repoURL: https://huggingface.co/settings/mcp
runtime: remote
remoteConfig:
  fixedURL: "https://huggingface.co/mcp?login&gradio=none"
